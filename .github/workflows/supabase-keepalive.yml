name: Supabase Keep-Alive

on:
  schedule:
    # Cada 3 días a las 9 AM UTC (3 AM Guatemala)
    - cron: '0 9 */3 * *'
  workflow_dispatch:  # Permite ejecutarlo manualmente desde GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Edge Function
        run: |
          echo "Pinging Supabase to keep project active..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://dmiaklorsfhmdxpccina.supabase.co/functions/v1/scan-receipt" \
            -H "Content-Type: application/json" \
            -d '{"image":"keepalive","language":"es"}')
          echo "HTTP Status: $RESPONSE"
          # Cualquier respuesta cuenta como actividad para Supabase
          # Solo fallar si no hubo respuesta (timeout, DNS, proyecto pausado)
          if [ -z "$RESPONSE" ] || [ "$RESPONSE" = "000" ]; then
            echo "Error: No response from Supabase (project may be paused)"
            exit 1
          fi
          echo "Supabase project pinged successfully (project is active)"

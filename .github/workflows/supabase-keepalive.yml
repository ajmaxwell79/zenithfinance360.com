name: Supabase Keep-Alive

on:
  schedule:
    # Cada día a las 9 AM UTC (3 AM Guatemala) — umbral Supabase es 7 días
    - cron: '0 9 * * *'
  workflow_dispatch:  # Permite ejecutarlo manualmente desde GitHub UI

# Permisos mínimos: este job solo hace peticiones salientes, no toca el repo.
permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Edge Function (3 pings)
        env:
          # Este repositorio es PÚBLICO. Ni la clave ni la URL del proyecto se
          # escriben aquí, aunque la anon key sea "pública por diseño": dejarla
          # en texto plano la vuelve indexable y facilita el abuso del endpoint.
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ] || [ -z "$SUPABASE_URL" ]; then
            echo "Faltan los secrets SUPABASE_ANON_KEY o SUPABASE_URL en el repositorio."
            exit 1
          fi
          echo "Pinging Supabase to keep project active..."
          for i in 1 2 3; do
            # Payload vacío: invoca la función real pero sale en la validación
            # "Missing image" (400) ANTES de llamar al API de Claude — costo cero
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST "$SUPABASE_URL/functions/v1/scan-receipt" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -d '{}')
            echo "Ping $i → HTTP $RESPONSE (400 = función viva, esperado)"
            if [ -z "$RESPONSE" ] || [ "$RESPONSE" = "000" ]; then
              echo "Error: No response from Supabase (project may be paused)"
              exit 1
            fi
            sleep 3
          done
          echo "Supabase keep-alive completado — proyecto activo"
